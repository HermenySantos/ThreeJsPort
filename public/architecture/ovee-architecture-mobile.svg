<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1306" role="img" aria-label="Ovee architecture: a draft reply reaches the voice and the room only after the operator approves it; discarded or expired drafts are dropped. Phones feed a workshop runtime whose synthesis reaches the same room wall.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9fc9bb"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fe0bf"/></marker></defs>
<rect width="420" height="1306" rx="22" fill="#0e1412"/>
<text x="40" y="40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.5" fill="#7fe0bf">OVEE · ARCHITECTURE</text>
<rect x="40" y="70" width="340" height="78" rx="14" stroke="#2f3d39" fill="#151e1b"/><text x="60" y="103" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Stage audio</text><text x="60" y="128" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">panel microphones</text>
<line x1="80" y1="148" x2="80" y2="202" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><text x="94" y="181.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#9fc9bb">WebRTC</text>
<rect x="40" y="206" width="340" height="78" rx="14" stroke="#2f3d39" fill="#151e1b"/><text x="60" y="239" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Live transcript</text><text x="60" y="264" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">OpenAI / Azure Realtime</text>
<line x1="80" y1="284" x2="80" y2="338" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><text x="94" y="317.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#9fc9bb">turns</text>
<rect x="40" y="342" width="340" height="78" rx="14" stroke="#2f3d39" fill="#151e1b"/><text x="60" y="375" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Draft reply</text><text x="60" y="400" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">GPT-4o · when addressed</text>
<line x1="80" y1="420" x2="80" y2="474" stroke="#7fe0bf" stroke-width="2" marker-end="url(#g)"/><text x="94" y="453.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#7fe0bf">pending draft</text>
<rect x="40" y="478" width="340" height="78" rx="14" stroke="#7fe0bf" stroke-width="2" fill="#13241e"/><text x="60" y="511" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Operator console</text><text x="60" y="536" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">approve · discard · expires after 12 s</text>

<line x1="80" y1="556" x2="80" y2="610" stroke="#7fe0bf" stroke-width="2" marker-end="url(#g)"/><text x="94" y="589.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#7fe0bf">approved text</text>
<rect x="40" y="614" width="340" height="78" rx="14" stroke="#2f3d39" fill="#151e1b"/><text x="60" y="647" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Voice clip</text><text x="60" y="672" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">TTS · stored, versioned</text>
<line x1="80" y1="692" x2="80" y2="746" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><text x="94" y="725.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#9fc9bb">WS notify + HTTP poll</text>
<rect x="40" y="750" width="340" height="78" rx="14" stroke="#2f3d39" fill="#151e1b"/><text x="60" y="783" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Room wall</text><text x="60" y="808" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">LED · speakers</text>
<text x="40" y="896" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.5" fill="#7fe0bf">IN PARALLEL · WORKSHOPS</text>
<rect x="40" y="916" width="340" height="78" rx="14" stroke="#2f3d39" fill="#151e1b"/><text x="60" y="949" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Phones</text><text x="60" y="974" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">one QR · no app</text>
<line x1="80" y1="994" x2="80" y2="1048" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><text x="94" y="1027.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#9fc9bb">submit</text>
<rect x="40" y="1052" width="340" height="78" rx="14" stroke="#2f3d39" fill="#151e1b"/><text x="60" y="1085" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Workshop runtime</text><text x="60" y="1110" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">one process, one async lock</text>
<line x1="80" y1="1130" x2="80" y2="1184" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><text x="94" y="1163.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#9fc9bb">inputs</text>
<rect x="40" y="1188" width="340" height="78" rx="14" stroke="#2f3d39" fill="#151e1b"/><text x="60" y="1221" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Synthesis</text><text x="60" y="1246" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">themes in 3–6 s → room wall</text>
</svg>