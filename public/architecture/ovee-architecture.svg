<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 640" role="img" aria-label="Ovee architecture: stage audio is transcribed and drafted on the backend, but a draft only reaches text-to-speech after an operator approves it; discarded or expired drafts are dropped. In parallel, phones submit workshop contributions to a single-process runtime whose synthesis reaches the same room wall.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9fc9bb"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7fe0bf"/>
    </marker>
  </defs>
  <rect width="1520" height="640" rx="24" fill="#0e1412"/>
  <text x="40" y="34" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.5" fill="#7fe0bf">OVEE · ARCHITECTURE</text>

  <!-- backend boundary -->
  <rect x="280" y="196" width="845" height="384" rx="18" fill="none" stroke="#3a4a45" stroke-dasharray="6 6"/>
  <text x="300" y="566" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">FastAPI backend · Azure App Service (P2v3)</text>

  <g font-family="Inter, Helvetica, Arial, sans-serif">
    <!-- operator gate (highlighted) -->
    <rect x="590" y="50" width="510" height="100" rx="14" fill="#13241e" stroke="#7fe0bf" stroke-width="2"/>
    <text x="614" y="88" font-size="19" font-weight="600" fill="#eef4f1">Operator console</text>
    <text x="614" y="116" font-size="14" fill="#b9cbc5">review the draft · approve or discard</text>
    <text x="614" y="136" font-size="13" fill="#8fa49d">browser app · trained project manager at the controls</text>

    <!-- row A -->
    <rect x="40" y="230" width="190" height="90" rx="14" fill="#151e1b" stroke="#2f3d39"/>
    <text x="62" y="268" font-size="17" font-weight="600" fill="#eef4f1">Stage audio</text>
    <text x="62" y="294" font-size="13" fill="#8fa49d">panel microphones</text>

    <rect x="300" y="230" width="220" height="90" rx="14" fill="#151e1b" stroke="#2f3d39"/>
    <text x="322" y="268" font-size="17" font-weight="600" fill="#eef4f1">Live transcript</text>
    <text x="322" y="294" font-size="13" fill="#8fa49d">OpenAI / Azure Realtime</text>

    <rect x="590" y="230" width="220" height="90" rx="14" fill="#151e1b" stroke="#2f3d39"/>
    <text x="612" y="268" font-size="17" font-weight="600" fill="#eef4f1">Draft reply</text>
    <text x="612" y="294" font-size="13" fill="#8fa49d">GPT-4o · when addressed</text>

    <rect x="880" y="230" width="220" height="90" rx="14" fill="#151e1b" stroke="#2f3d39"/>
    <text x="902" y="268" font-size="17" font-weight="600" fill="#eef4f1">Voice clip</text>
    <text x="902" y="294" font-size="13" fill="#8fa49d">TTS · stored, versioned</text>

    <rect x="1290" y="230" width="190" height="90" rx="14" fill="#151e1b" stroke="#2f3d39"/>
    <text x="1312" y="268" font-size="17" font-weight="600" fill="#eef4f1">Room wall</text>
    <text x="1312" y="294" font-size="13" fill="#8fa49d">LED · speakers</text>

    <!-- row B -->
    <rect x="40" y="440" width="190" height="90" rx="14" fill="#151e1b" stroke="#2f3d39"/>
    <text x="62" y="478" font-size="17" font-weight="600" fill="#eef4f1">Phones</text>
    <text x="62" y="504" font-size="13" fill="#8fa49d">one QR · no app</text>

    <rect x="300" y="440" width="510" height="90" rx="14" fill="#151e1b" stroke="#2f3d39"/>
    <text x="322" y="478" font-size="17" font-weight="600" fill="#eef4f1">Workshop runtime</text>
    <text x="322" y="504" font-size="13" fill="#8fa49d">one process, one async lock · table claims · contributions · timer</text>

    <rect x="880" y="440" width="220" height="90" rx="14" fill="#151e1b" stroke="#2f3d39"/>
    <text x="902" y="478" font-size="17" font-weight="600" fill="#eef4f1">Synthesis</text>
    <text x="902" y="504" font-size="13" fill="#8fa49d">themes in 3–6 s</text>

    <!-- arrows row A -->
    <line x1="230" y1="275" x2="296" y2="275" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/>
    <text x="263" y="262" font-size="12" text-anchor="middle" fill="#9fc9bb">WebRTC</text>
    <line x1="520" y1="275" x2="586" y2="275" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/>
    <text x="553" y="262" font-size="12" text-anchor="middle" fill="#9fc9bb">turns</text>

    <!-- the gate: no direct draft -> voice edge -->
    <line x1="700" y1="230" x2="700" y2="154" stroke="#7fe0bf" stroke-width="2" marker-end="url(#g)"/>
    <text x="712" y="196" font-size="12" fill="#7fe0bf">pending draft</text>
    <line x1="990" y1="150" x2="990" y2="226" stroke="#7fe0bf" stroke-width="2" marker-end="url(#g)"/>
    <text x="1002" y="196" font-size="12" fill="#7fe0bf">approved text</text>
    <line x1="1100" y1="100" x2="1250" y2="100" stroke="#8fa49d" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a)"/>
    <text x="1262" y="96" font-size="13" fill="#b9cbc5">discarded, or</text>
    <text x="1262" y="114" font-size="13" fill="#b9cbc5">expires after 12 s</text>

    <line x1="1100" y1="275" x2="1286" y2="275" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/>
    <text x="1193" y="262" font-size="12" text-anchor="middle" fill="#9fc9bb">WS notify + HTTP poll</text>

    <!-- arrows row B -->
    <line x1="230" y1="485" x2="296" y2="485" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/>
    <text x="263" y="472" font-size="12" text-anchor="middle" fill="#9fc9bb">submit</text>
    <line x1="810" y1="485" x2="876" y2="485" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/>
    <text x="843" y="472" font-size="12" text-anchor="middle" fill="#9fc9bb">inputs</text>
    <polyline points="1100,485 1385,485 1385,324" fill="none" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/>
    <text x="1193" y="472" font-size="12" text-anchor="middle" fill="#9fc9bb">themes</text>
  </g>
</svg>
