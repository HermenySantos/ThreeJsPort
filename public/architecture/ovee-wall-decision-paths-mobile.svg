<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 910" role="img" aria-label="Wall decision: inputs feed a pure priority stack that shows a takeover first, otherwise ambient content, otherwise an idle placeholder; a voice overlay then dims content while Ovee speaks."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9fc9bb"/></marker></defs><rect width="420" height="910" rx="22" fill="#0e1412"/><text x="40" y="40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#7fe0bf">OVEE · WALL DECISION</text><rect x="40" y="66" width="340" height="128" rx="14" fill="#151e1b" stroke="#2f3d39" stroke-width="1"/><text x="60" y="98" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#eef4f1" font-weight="600">Inputs</text><text x="60" y="122" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">ambient content available?</text><text x="60" y="142" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">active takeover?</text><text x="60" y="162" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">voice enabled · speaking?</text><text x="60" y="182" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">operator push: pin or split</text><line x1="80" y1="194" x2="80" y2="240" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><text x="94" y="223.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#9fc9bb">evaluated together</text><rect x="40" y="244" width="340" height="80" rx="14" fill="#13241e" stroke="#7fe0bf" stroke-width="2"/><text x="60" y="276" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#eef4f1" font-weight="600">decideWall()</text><text x="60" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">pure priority stack · first match wins</text><line x1="80" y1="324" x2="80" y2="364" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="368" width="340" height="78" rx="14" fill="#151e1b" stroke="#7fe0bf" stroke-width="2"/><text x="60" y="400" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#eef4f1" font-weight="600">1 · Takeover</text><text x="60" y="424" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">poll · audience question · workshop pin</text><line x1="80" y1="446" x2="80" y2="476" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><text x="94" y="467.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#9fc9bb">otherwise</text><rect x="40" y="480" width="340" height="78" rx="14" fill="#151e1b" stroke="#2f3d39" stroke-width="1"/><text x="60" y="512" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#eef4f1" font-weight="600">2 · Ambient</text><text x="60" y="536" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">else rotate messages · quotes · themes</text><line x1="80" y1="558" x2="80" y2="588" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><text x="94" y="579.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#9fc9bb">otherwise</text><rect x="40" y="592" width="340" height="78" rx="14" fill="#151e1b" stroke="#2f3d39" stroke-width="1"/><text x="60" y="624" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#eef4f1" font-weight="600">3 · Idle</text><text x="60" y="648" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">else Listening placeholder</text><line x1="80" y1="670" x2="80" y2="716" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><text x="94" y="699.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#9fc9bb">then the voice layer</text><rect x="40" y="720" width="340" height="150" rx="14" fill="#151e1b" stroke="#2f3d39" stroke-width="1"/><text x="60" y="752" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#eef4f1" font-weight="600">Voice overlay</text><text x="60" y="776" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">speaking + pin → content dims to 12%</text><text x="60" y="796" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">speaking + split → content at 50%</text><text x="60" y="816" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">not speaking → overlay hidden,</text><text x="60" y="836" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">wall fully readable</text></svg>