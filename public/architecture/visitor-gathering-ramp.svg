<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-label="Gathering flash: intensity rises linearly from off at 5 metres to full at 0.5 metres, and the screen turns solid white within 0.5 metres of the totem."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9fc9bb"/></marker></defs><rect width="1200" height="460" rx="22" fill="#0e1412"/><text x="60" y="40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#7fe0bf" text-anchor="start" letter-spacing="1.5">THE GATHERING · DISTANCE BECOMES LIGHT</text><text x="60" y="70" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d" text-anchor="start">Position updates at most 10 per second; the totem position comes from the CMS.</text><rect x="1035.0" y="130" width="105.0" height="220" fill="#eef4f1" opacity="0.92"/><polygon points="90.0,350 1035.0,130 1035.0,350" fill="#7fe0bf" opacity="0.18"/><line x1="90.0" y1="350" x2="1035.0" y2="130" stroke="#7fe0bf" stroke-width="3"/><line x1="90" y1="350" x2="1140" y2="350" stroke="#3a4a45"/><line x1="90.0" y1="350" x2="90.0" y2="356" stroke="#3a4a45"/><text x="90.0" y="374" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#8fa49d" text-anchor="middle">5 m</text><line x1="300.0" y1="350" x2="300.0" y2="356" stroke="#3a4a45"/><text x="300.0" y="374" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#8fa49d" text-anchor="middle">4 m</text><line x1="510.0" y1="350" x2="510.0" y2="356" stroke="#3a4a45"/><text x="510.0" y="374" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#8fa49d" text-anchor="middle">3 m</text><line x1="720.0" y1="350" x2="720.0" y2="356" stroke="#3a4a45"/><text x="720.0" y="374" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#8fa49d" text-anchor="middle">2 m</text><line x1="930.0" y1="350" x2="930.0" y2="356" stroke="#3a4a45"/><text x="930.0" y="374" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#8fa49d" text-anchor="middle">1 m</text><line x1="1035.0" y1="350" x2="1035.0" y2="356" stroke="#3a4a45"/><text x="1035.0" y="374" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#8fa49d" text-anchor="middle">0.5</text><line x1="1140.0" y1="350" x2="1140.0" y2="356" stroke="#3a4a45"/><text x="1140.0" y="374" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#8fa49d" text-anchor="middle">0 m</text><text x="615.0" y="402" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#8fa49d" text-anchor="middle">distance to the totem →  closer</text><text x="78" y="136" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#8fa49d" text-anchor="end">full</text><text x="78" y="350" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#8fa49d" text-anchor="end">off</text><text x="468.0" y="190" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#eef4f1" text-anchor="start">flash intensifies linearly</text><text x="468.0" y="210" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#eef4f1" text-anchor="start">as the visitor approaches</text><text x="1087.5" y="158" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#0e1412" text-anchor="middle">solid</text><text x="1087.5" y="176" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#0e1412" text-anchor="middle">white</text></svg>