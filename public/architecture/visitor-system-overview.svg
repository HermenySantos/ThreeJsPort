<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 640" role="img" aria-label="Visitor platform overview: visitor position, the guide tablet's commands and show cues all merge in one State Manager, which sends one state per visitor to each audio guide over MQTT; the CMS supplies content; voting kiosks follow show cues on a separate path."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9fc9bb"/></marker></defs><rect width="1560" height="640" rx="24" fill="#0e1412"/><text x="40" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#7fe0bf" text-anchor="start" letter-spacing="1.5">UN GENEVA VISITOR PLATFORM · SYSTEM OVERVIEW</text><rect x="350" y="70" width="600" height="300" rx="18" fill="none" stroke="#3a4a45" stroke-dasharray="6 6"/><text x="370" y="358" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d" text-anchor="start">Go tour services · PostgreSQL</text><rect x="40" y="90" width="240" height="90" rx="14" fill="#151e1b" stroke="#2f3d39"/><text x="60" y="124" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Indoor positioning</text><text x="60" y="150" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">Quuppa · visitor tags</text><rect x="40" y="230" width="240" height="90" rx="14" fill="#151e1b" stroke="#2f3d39"/><text x="60" y="264" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Guide tablet</text><text x="60" y="290" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">start · advance · device control</text><rect x="40" y="370" width="240" height="90" rx="14" fill="#151e1b" stroke="#2f3d39"/><text x="60" y="404" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Show control</text><text x="60" y="430" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">projection and media cues</text><rect x="370" y="90" width="230" height="90" rx="14" fill="#151e1b" stroke="#2f3d39"/><text x="390" y="124" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Position processor</text><text x="390" y="150" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">raw position → zone</text><rect x="370" y="230" width="230" height="90" rx="14" fill="#151e1b" stroke="#2f3d39"/><text x="390" y="264" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Tour REST API</text><text x="390" y="290" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">checks which tablet owns it</text><rect x="670" y="180" width="260" height="130" rx="14" fill="#13241e" stroke="#7fe0bf" stroke-width="2"/><text x="690" y="214" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">State Manager</text><text x="690" y="240" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">merges tour · show · zone</text><text x="690" y="260" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">→ one state per visitor</text><rect x="1110" y="180" width="250" height="130" rx="14" fill="#151e1b" stroke="#2f3d39"/><text x="1130" y="214" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Audio guides</text><text x="1130" y="240" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">plays the state it receives</text><text x="1130" y="260" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">captions · 8 languages</text><rect x="1300" y="40" width="220" height="90" rx="14" fill="#151e1b" stroke="#2f3d39"/><text x="1320" y="74" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Payload CMS</text><text x="1320" y="100" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">schedules · audio · captions</text><rect x="1110" y="500" width="250" height="90" rx="14" fill="#151e1b" stroke="#2f3d39"/><text x="1130" y="534" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Voting kiosks</text><text x="1130" y="560" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">choices · amendments · votes</text><polyline points="280,135 366,135" fill="none" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><polyline points="280,275 366,275" fill="none" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><text x="323" y="262" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9fc9bb">commands</text><polyline points="600,135 635,135 635,215 666,215" fill="none" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><text x="640" y="124" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#9fc9bb">zone updates</text><polyline points="600,275 666,275" fill="none" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><polyline points="280,415 635,415 635,285 666,285" fill="none" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><text x="460" y="404" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9fc9bb">show state + media</text><polyline points="930,245 1106,245" fill="none" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><text x="1018" y="232" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9fc9bb">per-visitor state</text><text x="1018" y="268" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#8fa49d" text-anchor="middle">MQTT · not retained</text><polyline points="1410,130 1410,155 1290,155 1290,176" fill