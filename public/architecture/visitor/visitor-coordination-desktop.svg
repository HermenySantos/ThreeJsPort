<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc"><title id="title">Different inputs. One coherent experience.</title><desc id="desc">Essential flows behind the visitor journey.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b8efd3" stroke-width="1.5"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="860" rx="22" fill="#101716"/><text x="32" y="42" fill="#b8efd3" font-size="13" font-weight="700">02 / SYSTEM COORDINATION</text><text x="32" y="83" fill="#f0f3ed" font-size="28" font-weight="600">Different inputs. One coherent experience.</text><text x="32" y="113" fill="#a8b9b1" font-size="16" font-weight="400">Essential flows behind the visitor journey.</text><text x="32" y="164" fill="#a8b9b1" font-size="12" font-weight="700">INPUTS</text><text x="450" y="164" fill="#a8b9b1" font-size="12" font-weight="700">COORDINATION</text><text x="880" y="164" fill="#a8b9b1" font-size="12" font-weight="700">VISITOR INTERFACE</text><rect x="32" y="184" width="352" height="82" rx="16" fill="#192321" stroke="#354b45"/><text x="50" y="215" fill="#f0f3ed" font-size="19" font-weight="600">Guide tablet → Tour API</text><text x="50" y="242" fill="#a8b9b1" font-size="15" font-weight="400">Tour commands and session context</text><rect x="32" y="288" width="352" height="82" rx="16" fill="#192321" stroke="#354b45"/><text x="50" y="319" fill="#f0f3ed" font-size="19" font-weight="600">Show control</text><text x="50" y="346" fill="#a8b9b1" font-size="15" font-weight="400">Show state and media cues</text><rect x="32" y="392" width="352" height="82" rx="16" fill="#192321" stroke="#354b45"/><text x="50" y="423" fill="#f0f3ed" font-size="19" font-weight="600">Indoor positioning → Processor</text><text x="50" y="450" fill="#a8b9b1" font-size="15" font-weight="400">Filtered visitor-location updates</text><rect x="450" y="260" width="330" height="160" rx="16" fill="#192321" stroke="#b8efd3"/><text x="472" y="298" fill="#f0f3ed" font-size="23" font-weight="600">State coordination</text><text x="472" y="330" fill="#a8b9b1" font-size="17" font-weight="400">Combines tour, show and location</text><text x="472" y="357" fill="#a8b9b1" font-size="17" font-weight="400">to determine each visitor’s</text><text x="472" y="384" fill="#a8b9b1" font-size="17" font-weight="400">audio state.</text><path d="M 384 225 H 414 V 300 H 450" fill="none" stroke="#b8efd3" stroke-width="2" marker-end="url(#arrow)"/><path d="M 384 329 H 450" fill="none" stroke="#b8efd3" stroke-width="2" marker-end="url(#arrow)"/><path d="M 384 433 H 414 V 380 H 450" fill="none" stroke="#b8efd3" stroke-width="2" marker-end="url(#arrow)"/><rect x="880" y="280" width="288" height="122" rx="16" fill="#192321" stroke="#354b45"/><text x="902" y="320" fill="#f0f3ed" font-size="22" font-weight="600">Visitor audio guide</text><text x="902" y="350" fill="#a8b9b1" font-size="16" font-weight="400">Plays the appropriate audio</text><text x="902" y="377" fill="#a8b9b1" font-size="16" font-weight="400">for the visitor’s current state.</text><path d="M 780 340 H 880" fill="none" stroke="#b8efd3" stroke-width="2" marker-end="url(#arrow)"/><text x="792" y="322" fill="#b8efd3" font-size="14" font-weight="400">Live state</text><path d="M 32 506 H 1168" stroke="#354b45"/><text x="32" y="540" fill="#a8b9b1" font-size="12" font-weight="700">SHARED VOTING · A SEPARATE CUE-DRIVEN FLOW</text><rect x="32" y="563" width="352" height="102" rx="16" fill="#192321" stroke="#354b45"/><text x="54" y="601" fill="#f0f3ed" font-size="21" font-weight="600">Show-control integration</text><text x="54" y="631" fill="#a8b9b1" font-size="16" font-weight="400">Presentation cues and shared results</text><rect x="880" y="563" width="288" height="102" rx="16" fill="#192321" stroke="#354b45"/><text x="902" y="601" fill="#f0f3ed" font-size="22" font-weight="600">Voting kiosk</text><text x="902" y="631" fill="#a8b9b1" font-size="15" font-weight="400">Choices, amendments and votes</text><path d="M 384 590 H 880" fill="none" stroke="#b8efd3" stroke-width="2" marker-end="url(#arrow)"/><text x="525" y="578" fill="#b8efd3" font-size="16" font-weight="400">Cues + shared results</text><path d="M 880 638 H 384" fill="none" stroke="#b8efd3" stroke-width="2" marker-end="url(#arrow)"/><text x="552" y="661" fill="#b8efd3" font-size="16" font-weight="400">Visitor choices</text><rect x="32" y="714" width="1136" height="108" rx="16" fill="#192321" stroke="#354b45"/><text x="54" y="746" fill="#b8efd3" font-size="12" font-weight="700">CONTENT &amp; MESSAGING</text><text x="54" y="775" fill="#a8b9b1" font-size="18" font-weight="400">Payload CMS supplies schedules, content and media to applications and services.</text><text x="54" y="802" fill="#a8b9b1" font-size="18" font-weight="400">Application APIs handle requests; MQTT carries live events and state updates.</text></g></svg>