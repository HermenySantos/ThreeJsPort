<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1330" viewBox="0 0 420 1330" role="img" aria-labelledby="title desc"><title id="title">What keeps it in sync</title><desc id="desc">Essential flows behind the visitor journey.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b8efd3" stroke-width="1.5"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="420" height="1330" rx="22" fill="#101716"/><text x="32" y="42" fill="#b8efd3" font-size="13" font-weight="700">02 / SYSTEM COORDINATION</text><text x="32" y="83" fill="#f0f3ed" font-size="28" font-weight="600">What keeps it in sync</text><text x="32" y="113" fill="#a8b9b1" font-size="16" font-weight="400">Essential flows behind the visitor journey.</text><text x="32" y="155" fill="#a8b9b1" font-size="12" font-weight="700">THREE INPUTS</text><rect x="32" y="173" width="332" height="78" rx="16" fill="#192321" stroke="#354b45"/><text x="48" y="202" fill="#f0f3ed" font-size="17" font-weight="600">Guide tablet → Tour API</text><text x="48" y="228" fill="#a8b9b1" font-size="14" font-weight="400">Tour commands and session context</text><rect x="32" y="270" width="332" height="78" rx="16" fill="#192321" stroke="#354b45"/><text x="48" y="299" fill="#f0f3ed" font-size="17" font-weight="600">Show control</text><text x="48" y="325" fill="#a8b9b1" font-size="14" font-weight="400">Show state and media cues</text><rect x="32" y="367" width="332" height="78" rx="16" fill="#192321" stroke="#354b45"/><text x="48" y="396" fill="#f0f3ed" font-size="17" font-weight="600">Indoor positioning → Processor</text><text x="48" y="422" fill="#a8b9b1" font-size="14" font-weight="400">Filtered visitor-location updates</text><path d="M 364 212 H 387 V 471 H 210 V 493 M 364 309 H 387 M 364 406 H 387" fill="none" stroke="#b8efd3" stroke-width="2"/><path d="M 210 471 V 500" fill="none" stroke="#b8efd3" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="502" width="356" height="139" rx="16" fill="#192321" stroke="#b8efd3"/><text x="52" y="537" fill="#f0f3ed" font-size="23" font-weight="600">State coordination</text><text x="52" y="570" fill="#a8b9b1" font-size="16" font-weight="400">Combines tour, show and location</text><text x="52" y="597" fill="#a8b9b1" font-size="16" font-weight="400">to determine each visitor’s audio state.</text><path d="M 210 641 V 698" fill="none" stroke="#b8efd3" stroke-width="2" marker-end="url(#arrow)"/><text x="228" y="676" fill="#b8efd3" font-size="14" font-weight="400">Live state</text><rect x="32" y="700" width="356" height="101" rx="16" fill="#192321" stroke="#354b45"/><text x="52" y="737" fill="#f0f3ed" font-size="22" font-weight="600">Visitor audio guide</text><text x="52" y="771" fill="#a8b9b1" font-size="15" font-weight="400">Plays audio for the visitor’s current state.</text><text x="32" y="848" fill="#a8b9b1" font-size="12" font-weight="700">SHARED VOTING · SEPARATE FLOW</text><rect x="32" y="867" width="356" height="71" rx="16" fill="#192321" stroke="#354b45"/><text x="52" y="908" fill="#f0f3ed" font-size="22" font-weight="600">Show-control integration</text><path d="M 102 938 V 1016" fill="none" stroke="#b8efd3" stroke-width="2" marker-end="url(#arrow)"/><path d="M 318 1016 V 938" fill="none" stroke="#b8efd3" stroke-width="2" marker-end="url(#arrow)"/><text x="115" y="965" fill="#b8efd3" font-size="15" font-weight="400">Cues + results ↓</text><text x="115" y="988" fill="#b8efd3" font-size="15" font-weight="400">Visitor choices ↑</text><rect x="32" y="1018" width="356" height="66" rx="16" fill="#192321" stroke="#354b45"/><text x="52" y="1058" fill="#f0f3ed" font-size="22" font-weight="600">Voting kiosk</text><rect x="32" y="1124" width="356" height="173" rx="16" fill="#192321" stroke="#354b45"/><text x="52" y="1156" fill="#b8efd3" font-size="12" font-weight="700">CONTENT &amp; MESSAGING</text><text x="52" y="1186" fill="#a8b9b1" font-size="16" font-weight="400">CMS supplies schedules, content and</text><text x="52" y="1213" fill="#a8b9b1" font-size="16" font-weight="400">media to applications and services.</text><text x="52" y="1240" fill="#a8b9b1" font-size="16" font-weight="400">APIs handle requests; MQTT carries</text><text x="52" y="1267" fill="#a8b9b1" font-size="16" font-weight="400">live events and state updates.</text></g></svg>