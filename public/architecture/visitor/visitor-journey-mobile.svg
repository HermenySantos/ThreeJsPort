<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1030" viewBox="0 0 420 1030" role="img" aria-labelledby="title desc"><title id="title">One connected tour.</title><desc id="desc">A visitor journey across rooms and devices.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b8efd3" stroke-width="1.5"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="420" height="1030" rx="22" fill="#101716"/><text x="32" y="42" fill="#b8efd3" font-size="13" font-weight="700">01 / THE EXPERIENCE</text><text x="32" y="83" fill="#f0f3ed" font-size="28" font-weight="600">One connected tour.</text><text x="32" y="113" fill="#a8b9b1" font-size="16" font-weight="400">A visitor journey across rooms and devices.</text><rect x="32" y="146" width="356" height="150" rx="16" fill="#192321" stroke="#354b45"/><text x="52" y="175" fill="#b8efd3" font-size="15" font-weight="700">01</text><text x="52" y="205" fill="#f0f3ed" font-size="22" font-weight="600">Join the tour</text><text x="52" y="230" fill="#b8efd3" font-size="11" font-weight="700">AUDIO GUIDE</text><text x="52" y="258" fill="#a8b9b1" font-size="16" font-weight="400">Choose a language.</text><text x="52" y="281" fill="#a8b9b1" font-size="16" font-weight="400">Join the scheduled tour.</text><path d="M 210 299 V 319" fill="none" stroke="#b8efd3" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="322" width="356" height="150" rx="16" fill="#192321" stroke="#354b45"/><text x="52" y="351" fill="#b8efd3" font-size="15" font-weight="700">02</text><text x="52" y="381" fill="#f0f3ed" font-size="22" font-weight="600">Explore the rooms</text><text x="52" y="406" fill="#b8efd3" font-size="11" font-weight="700">AUDIO GUIDE</text><text x="52" y="434" fill="#a8b9b1" font-size="16" font-weight="400">Audio follows location</text><text x="52" y="457" fill="#a8b9b1" font-size="16" font-weight="400">and the show’s cues.</text><path d="M 210 475 V 495" fill="none" stroke="#b8efd3" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="498" width="356" height="150" rx="16" fill="#192321" stroke="#354b45"/><text x="52" y="527" fill="#b8efd3" font-size="15" font-weight="700">03</text><text x="52" y="557" fill="#f0f3ed" font-size="22" font-weight="600">Make a choice</text><text x="52" y="582" fill="#b8efd3" font-size="11" font-weight="700">VOTING KIOSK</text><text x="52" y="610" fill="#a8b9b1" font-size="16" font-weight="400">Consider priorities.</text><text x="52" y="633" fill="#a8b9b1" font-size="16" font-weight="400">Cast a vote.</text><path d="M 210 651 V 671" fill="none" stroke="#b8efd3" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="674" width="356" height="150" rx="16" fill="#192321" stroke="#354b45"/><text x="52" y="703" fill="#b8efd3" font-size="15" font-weight="700">04</text><text x="52" y="733" fill="#f0f3ed" font-size="22" font-weight="600">See the result</text><text x="52" y="758" fill="#b8efd3" font-size="11" font-weight="700">VOTING KIOSK</text><text x="52" y="786" fill="#a8b9b1" font-size="16" font-weight="400">Follow the presentation.</text><text x="52" y="809" fill="#a8b9b1" font-size="16" font-weight="400">See the group’s results.</text><rect x="32" y="866" width="356" height="130" rx="16" fill="#192321" stroke="#354b45"/><text x="52" y="895" fill="#b8efd3" font-size="12" font-weight="700">GUIDE TABLET</text><text x="52" y="925" fill="#a8b9b1" font-size="16" font-weight="400">Staff start, advance and end the tour,</text><text x="52" y="952" fill="#a8b9b1" font-size="16" font-weight="400">with visitor-device status in view.</text></g></svg>