<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 644" role="img" aria-label="Movement check: normalise sensors; if there is walking evidence and a shake lasts at least 200 milliseconds, penalise; otherwise normal play."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9fc9bb"/></marker></defs><rect width="420" height="644" rx="22" fill="#0e1412"/><text x="40" y="40" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#7fe0bf" letter-spacing="1.5">WALKING, NOT SHAKING</text><rect x="40" y="66" width="340" height="82" rx="14" fill="#151e1b" stroke="#2f3d39"/><text x="60" y="100" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Phone sensors</text><text x="60" y="126" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">gyroscope · accelerometer</text><polyline points="80,148 80,194" fill="none" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><text x="94" y="177.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#9fc9bb">normalise 30/60/100 Hz</text><rect x="40" y="198" width="340" height="82" rx="14" fill="#151e1b" stroke="#2f3d39"/><text x="60" y="232" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Walking evidence?</text><text x="60" y="258" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">no → normal play</text><polyline points="80,280 80,326" fill="none" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><text x="94" y="309.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#9fc9bb">yes</text><rect x="40" y="330" width="340" height="82" rx="14" fill="#13241e" stroke="#7fe0bf" stroke-width="2"/><text x="60" y="364" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Shake ≥ 200 ms?</text><text x="60" y="390" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">no → normal play</text><polyline points="80,412 80,458" fill="none" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><text x="94" y="441.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#9fc9bb">yes</text><rect x="40" y="462" width="340" height="82" rx="14" fill="#2a1a1a" stroke="#f2a3a3" stroke-width="2"/><text x="60" y="496" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Penalise</text><text x="60" y="522" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">energy drained</text><text x="40" y="574" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#8fa49d">Raw sensors are used if the normaliser</text><text x="40" y="592" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#8fa49d">fails to load in 1.5 s; thresholds</text><text x="40" y="610" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#8fa49d">calibrate per device.</text></svg>