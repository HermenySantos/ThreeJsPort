<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 470" role="img" aria-label="Movement check: sensor data is normalised across iOS and Android sampling rates, falling back to raw sensors; shaking is penalised only when there is walking evidence and the shake lasts at least 200 milliseconds; otherwise movement counts as normal play."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9fc9bb"/></marker></defs><rect width="1560" height="470" rx="24" fill="#0e1412"/><text x="40" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#7fe0bf" letter-spacing="1.5">WALKING, NOT SHAKING · ON-DEVICE MOVEMENT CHECK</text><rect x="40" y="90" width="250" height="90" rx="14" fill="#151e1b" stroke="#2f3d39"/><text x="60" y="124" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Phone sensors</text><text x="60" y="150" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">gyroscope · accelerometer</text><rect x="350" y="90" width="290" height="90" rx="14" fill="#151e1b" stroke="#2f3d39"/><text x="370" y="124" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Normalise the stream</text><text x="370" y="150" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">30 / 60 / 100 Hz → one scale</text><rect x="700" y="90" width="260" height="90" rx="14" fill="#151e1b" stroke="#2f3d39"/><text x="720" y="124" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Walking evidence?</text><text x="720" y="150" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">steps, not just jolts</text><rect x="1020" y="90" width="250" height="90" rx="14" fill="#13241e" stroke="#7fe0bf" stroke-width="2"/><text x="1040" y="124" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Shake ≥ 200 ms?</text><text x="1040" y="150" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">sustained, not a bump</text><rect x="1310" y="90" width="220" height="90" rx="14" fill="#2a1a1a" stroke="#f2a3a3" stroke-width="2"/><text x="1330" y="124" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Penalise</text><text x="1330" y="150" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">energy drained</text><rect x="1020" y="280" width="250" height="90" rx="14" fill="#151e1b" stroke="#2f3d39"/><text x="1040" y="314" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Normal play</text><text x="1040" y="340" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">movement counts as energy</text><rect x="350" y="280" width="290" height="90" rx="14" fill="#151e1b" stroke="#2f3d39"/><text x="370" y="314" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#eef4f1">Raw sensors</text><text x="370" y="340" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">if the library fails in 1.5 s</text><polyline points="290,135 346,135" fill="none" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><polyline points="640,135 696,135" fill="none" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><polyline points="960,135 1016,135" fill="none" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><text x="988" y="124" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9fc9bb">yes</text><polyline points="1270,135 1306,135" fill="none" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><text x="1288" y="124" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9fc9bb">yes</text><polyline points="830,180 830,325 1016,325" fill="none" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><text x="842" y="260" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#9fc9bb">no</text><polyline points="1145,180 1145,276" fill="none" stroke="#9fc9bb" stroke-width="2" marker-end="url(#a)"/><text x="1157" y="232" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#9fc9bb">no</text><polyline points="495,276 495,184" fill="none" stroke="#9fc9bb" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a)"/><text x="507" y="232" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#9fc9bb">fallback</text><text x="40" y="430" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#8fa49d">Thresholds calibrate per device and were softened after testing showed false positives on honest walkers.</text></svg>